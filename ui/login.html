<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – RPMS</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <div class="l-icon">R</div>
      <div class="l-text">
        RPMS
        <small>Recruitment &amp; Placement<br/>Management System</small>
      </div>
    </div>
    <div class="login-title">RECRUITMENT &amp; PLACEMENT MANAGEMENT SYSTEM</div>

    <form action="dashboard.html" method="get">
      <div class="form-group">
        <label for="username">Username / Email <span class="req">*</span></label>
        <input type="email" id="username" class="form-control" value="recruiter@demo.com" placeholder="Enter email" required/>
      </div>
      <div class="form-group">
        <label for="password">Password <span class="req">*</span></label>
        <input type="password" id="password" class="form-control" value="Demo@1234" placeholder="Enter password" required/>
      </div>
      <div class="form-group">
        <label for="role">Role <span class="req">*</span></label>
        <select id="role" class="form-control">
          <option value="">-- Select Role --</option>
          <option value="admin">Admin</option>
          <option value="recruiter" selected>Recruiter</option>
          <option value="placement">Placement Officer</option>
        </select>
      </div>
      <div class="login-actions">
        <button type="submit" class="btn btn-primary">&#128274; Login</button>
        <button type="reset" class="btn btn-outline">&#8635; Reset</button>
      </div>
    </form>

    <div class="login-hint">
      <strong>&#128161; Demo Credentials</strong>
      Email: recruiter@demo.com &nbsp;|&nbsp; Role: Recruiter<br/>
      Password: Demo@1234
    </div>
  </div>
</body>
</html>
